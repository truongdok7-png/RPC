[package]
name = "discordpresence"
version = "2.2.0"
edition = "2021"
description = "DiscordPresence - Rich Presence thay thế PreMiD (port Rust của main.py)"

[dependencies]
eframe = { version = "0.27.2", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.27.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "2", features = ["json"] }
percent-encoding = "2"
chrono = "0.4"
winreg = "0.52"
rfd = "0.15"
webbrowser = "1"
tray-icon = "0.26"
muda = "0.21"
uiautomation = "0.16"
crossbeam-channel = "0.5"
once_cell = "1"

[dependencies.windows]
version = "0.59"
features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
]

[profile.release]
lto = false
codegen-units = 16
